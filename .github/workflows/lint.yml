name: lint

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first -- no point linting
# a commit you have already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fourmolu:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/run-fourmolu@v11
        with:
          # Must match your local fourmolu, or CI will disagree with
          # your editor about a file you just saved.
          version: "0.20.0.0"
          # hw/ and hw-test/ are included even though they are behind
          # the `hardware` cabal flag: formatting does not need them to
          # build.
          pattern: |
            spec/**/*.hs
            src/**/*.hs
            app/**/*.hs
            bin/**/*.hs
            test/**/*.hs
            hw/**/*.hs
            hw-test/**/*.hs

  hlint:
    name: hlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.8"

      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["spec/", "src/", "app/", "bin/", "test/", "hw/", "hw-test/"]'
          fail-on: warning
